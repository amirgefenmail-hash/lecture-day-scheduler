<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}img{max-width:100%}body{margin:0}</style>
<title>מחולל לו"ז ליום הרצאות</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Rubik:wght@500;700&display=swap">
<style>
/* Layout: settings column beside a live timetable (stacked on phones), a proportional "day ribbon" above the table, export bar under it. */
:root {
  --bg: #F5F7FA;
  --surface: #FFFFFF;
  --fg: #15202C;
  --muted: #5A6878;
  --line: #DCE3EB;
  --accent: #1F4E78;
  --accent-fg: #FFFFFF;
  --accent-soft: #E5EDF5;
  --break: #EFF2F6;
  --long: #D6E3F0;
  --edge: #8FA3B8;
  --danger: #B42318;
  --danger-soft: #FDECEA;
  --ok: #18794E;
  --font-body: "Heebo", "Segoe UI", Arial, "Helvetica Neue", sans-serif;
  --font-display: "Rubik", "Heebo", "Segoe UI", Arial, sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E141B; --surface: #161F29; --fg: #E6ECF2; --muted: #98A6B5; --line: #283442;
    --accent: #80B1DF; --accent-fg: #0E141B; --accent-soft: #1B2D40; --break: #1B2530; --long: #23384E;
    --edge: #5D7287; --danger: #F59A90; --danger-soft: #3A1E1C; --ok: #6FD3A2; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E141B; --surface: #161F29; --fg: #E6ECF2; --muted: #98A6B5; --line: #283442;
  --accent: #80B1DF; --accent-fg: #0E141B; --accent-soft: #1B2D40; --break: #1B2530; --long: #23384E;
  --edge: #5D7287; --danger: #F59A90; --danger-soft: #3A1E1C; --ok: #6FD3A2; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 0;
}
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* Header */
header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
.brand { flex: 1 1 260px; min-width: 0; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; line-height: 1.2; margin: 0; text-wrap: balance; }
.brand p { margin: 2px 0 0; color: var(--muted); font-size: .95rem; }
.top-actions { display: flex; align-items: center; gap: 8px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; font-size: .9rem; min-height: 36px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); font-weight: 500; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; min-width: 40px; min-height: 40px; padding: 0 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.icon-btn:hover { border-color: var(--edge); }
.pop-wrap { position: relative; }
.pop { position: absolute; top: calc(100% + 6px); inset-inline-end: 0; z-index: 30; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 8px 24px rgba(15, 30, 50, .14); padding: 6px; min-width: 210px; display: flex; flex-direction: column; }
.pop button { text-align: start; border: 0; background: transparent; padding: 10px 12px; border-radius: 8px; min-height: 44px; }
.pop button:hover { background: var(--accent-soft); }
.pop button.danger { color: var(--danger); }

/* Day tabs */
.tabs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.tab { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 6px 4px 14px; min-height: 40px; }
[dir="rtl"] .tab { padding: 4px 14px 4px 6px; }
.tab.active { border-color: var(--accent); background: var(--accent-soft); font-weight: 500; }
.tab .tab-name { border: 0; background: transparent; padding: 4px 0; }
.tab input { border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; width: 10em; background: var(--surface); }
.tab .mini { border: 0; background: transparent; width: 30px; height: 30px; border-radius: 50%; color: var(--muted); font-size: .95rem; }
.tab .mini:hover { background: var(--line); color: var(--fg); }

/* Main grid */
.main { display: grid; grid-template-columns: 360px minmax(0, 1fr); gap: 20px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.settings { padding: 18px; display: flex; flex-direction: column; gap: 16px; }
.settings-head { display: flex; justify-content: space-between; align-items: center; }
.settings-head h2 { font-family: var(--font-display); font-size: 1.05rem; font-weight: 500; margin: 0; }
.collapse-btn { display: none; }
.settings-body { display: flex; flex-direction: column; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .field > .lbl { font-size: .92rem; font-weight: 500; }
.field input[type="time"], .field input[type="number"], .field select {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; min-height: 44px; width: 100%;
  font-variant-numeric: tabular-nums;
}
.field input.invalid { border-color: var(--danger); background: var(--danger-soft); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.hint { font-size: .85rem; color: var(--muted); margin: 0; }
.err { font-size: .85rem; color: var(--danger); margin: 0; }
.len-line { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }
.len-line input { flex: 1 1 90px; width: auto !important; }
.divider { border: 0; border-top: 1px solid var(--line); margin: 0; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; cursor: pointer; }
.switch .s-text { display: flex; flex-direction: column; }
.switch .s-text b { font-weight: 500; font-size: .95rem; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.track { flex: none; width: 44px; height: 26px; border-radius: 999px; background: var(--line); position: relative; transition: background .15s; }
.track::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: inset-inline-start .15s; }
.switch input:checked + .track { background: var(--accent); }
.switch input:checked + .track::after { inset-inline-start: 21px; }
.switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
.sub { display: flex; flex-direction: column; gap: 12px; padding-inline-start: 12px; border-inline-start: 2px solid var(--accent-soft); }

/* Results */
.results { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.summary { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.headline { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 14px; }
.headline .big { font-family: var(--font-display); font-weight: 700; font-size: 2.1rem; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.headline .txt { font-size: 1.05rem; font-weight: 500; }
.headline .slack { color: var(--muted); font-size: .95rem; flex-basis: 100%; }
.banner { border-radius: 8px; padding: 10px 12px; background: var(--danger-soft); color: var(--danger); font-size: .92rem; }
.notice { border-radius: 8px; padding: 8px 12px; background: var(--accent-soft); font-size: .9rem; }
.suggest { border: 1px solid var(--accent); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; background: var(--accent-soft); }
.suggest h3 { margin: 0; font-size: 1rem; font-family: var(--font-display); font-weight: 500; }
.suggest p { margin: 0; font-size: .9rem; color: var(--muted); }
.suggest ol { margin: 0; padding-inline-start: 22px; display: flex; flex-direction: column; gap: 6px; }
.suggest li button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; min-height: 40px; text-align: start; }
.suggest li button:hover { border-color: var(--accent); }

/* Ribbon */
.ribbon-box { display: flex; flex-direction: column; gap: 4px; }
.ribbon { display: flex; height: 34px; border-radius: 7px; overflow: hidden; border: 1px solid var(--line); }
.ribbon span { min-width: 2px; display: flex; align-items: center; justify-content: center; font-size: .78rem; font-weight: 500; overflow: hidden; white-space: nowrap; border-inline-end: 1px solid var(--surface); }
.ribbon span:last-child { border-inline-end: 0; }
.ribbon .k-lecture { background: var(--accent); color: var(--accent-fg); }
.ribbon .k-break { background: var(--break); }
.ribbon .k-long { background: var(--long); }
.ribbon .k-gather, .ribbon .k-wrap { background: repeating-linear-gradient(135deg, var(--surface) 0 4px, var(--break) 4px 8px); }
.ribbon-ends { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Table */
.table-panel { padding: 6px 0 0; }
.table-tools { display: flex; justify-content: flex-end; padding: 6px 14px 4px; }
.table-tools .switch { min-height: 36px; gap: 10px; }
.table-tools .switch b { font-weight: 400; font-size: .9rem; color: var(--muted); }
.tt-scroll { overflow-x: auto; }
table.tt { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.tt th { font-size: .82rem; font-weight: 500; color: var(--muted); text-align: start; padding: 8px 10px; border-bottom: 1px solid var(--line); letter-spacing: .02em; }
.tt td { padding: 4px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; font-size: .95rem; }
.tt tr:last-child td { border-bottom: 0; }
.tt .c-num { width: 40px; color: var(--muted); }
.tt .c-time { width: 76px; }
.tt .c-len { width: 96px; }
.tt .c-act { width: 86px; white-space: nowrap; }
.tt tr.k-break td { background: var(--break); }
.tt tr.k-long td { background: var(--long); }
.tt tr.k-gather td, .tt tr.k-wrap td { background: repeating-linear-gradient(135deg, transparent 0 6px, var(--break) 6px 12px); }
.tt tr.k-lecture td.c-name { font-weight: 500; }
.name-box { display: flex; align-items: center; gap: 4px; min-width: 0; }
.name-in, .lect-in { border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 6px 6px; width: 100%; min-width: 0; min-height: 38px; font-weight: inherit; }
.name-in:hover, .lect-in:hover { border-color: var(--line); }
.name-in:focus, .lect-in:focus { border-color: var(--accent); background: var(--surface); }
.lect-in::placeholder { color: var(--muted); font-weight: 400; opacity: .8; }
.lect-inline { display: none; }
.lect-inline .lect-in { font-size: .85rem; min-height: 32px; font-weight: 400; }
.len-in { width: 76px; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 8px; min-height: 38px; font-variant-numeric: tabular-nums; }
.row-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; min-width: 34px; min-height: 34px; font-size: .95rem; color: var(--muted); }
.row-btn:hover { color: var(--fg); border-color: var(--edge); }
.row-btn.danger:hover { color: var(--danger); border-color: var(--danger); }
.reset-name { border: 0; background: transparent; color: var(--muted); width: 30px; height: 30px; border-radius: 50%; flex: none; font-size: .9rem; }
.reset-name:hover { background: var(--line); color: var(--fg); }
.stale { opacity: .45; pointer-events: none; }
.totals { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border-top: 1px solid var(--line); border-radius: 0 0 var(--radius) var(--radius); overflow: hidden; }
.totals div { background: var(--surface); padding: 10px 14px; display: flex; flex-direction: column; }
.totals dt { font-size: .8rem; color: var(--muted); }
.totals dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; }

/* Export bar */
.export { padding: 12px 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.export .lbl { font-size: .85rem; color: var(--muted); margin-inline-end: 4px; }
.export button.xbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; min-height: 44px; font-weight: 500; }
.export button.xbtn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.export button.xbtn:hover { border-color: var(--accent); }
.export button.xbtn:disabled { opacity: .5; cursor: progress; }
.export .all { display: inline-flex; align-items: center; gap: 6px; font-size: .9rem; margin-inline-start: auto; min-height: 44px; }
.export .all input { width: 18px; height: 18px; accent-color: var(--accent); }
footer.foot { color: var(--muted); font-size: .8rem; text-align: center; padding-block: 8px 24px; }

/* Modal and toast */
.modal-back { position: fixed; inset: 0; background: rgba(10, 20, 30, .45); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.modal { background: var(--surface); border-radius: 12px; padding: 20px; max-width: 420px; width: 100%; display: flex; flex-direction: column; gap: 16px; border: 1px solid var(--line); }
.modal p { margin: 0; font-size: 1rem; }
.modal textarea { width: 100%; min-height: 160px; border: 1px solid var(--line); border-radius: 8px; padding: 8px; background: var(--bg); font-family: var(--font-body); }
.modal .btns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.modal .btns button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 16px; min-height: 44px; }
.modal .btns button.ok { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 500; }
.toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: .92rem; z-index: 60; max-width: min(92vw, 460px); display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; box-shadow: 0 6px 20px rgba(0,0,0,.2); }
.toast a { color: inherit; font-weight: 700; }

/* Off-screen export canvas for PDF */
#pdf-stage { position: absolute; top: 0; left: -12000px; width: 760px; background: #fff; color: #111; font-family: "Heebo", Arial, sans-serif; }
#pdf-stage .page { padding: 36px 40px; background: #fff; }
#pdf-stage h1 { font-size: 22px; margin: 0 0 4px; }
#pdf-stage .date { color: #555; font-size: 13px; margin-bottom: 18px; }
#pdf-stage h2 { font-size: 17px; margin: 0 0 10px; }
#pdf-stage table { width: 100%; border-collapse: collapse; font-size: 14px; margin-bottom: 18px; }
#pdf-stage th, #pdf-stage td { border: 1px solid #C9D2DC; padding: 7px 9px; text-align: start; }
#pdf-stage th { background: #DCE7F2; font-weight: 700; }
#pdf-stage tr.k-break td { background: #F1F3F6; }
#pdf-stage tr.k-long td { background: #E3ECF5; }

@media (max-width: 900px) {
  .main { grid-template-columns: minmax(0, 1fr); }
  .collapse-btn { display: inline-flex; }
  .settings.collapsed .settings-body { display: none; }
}
@media (max-width: 600px) {
  .brand h1 { font-size: 1.25rem; }
  .tt .c-num, .tt .c-lect { display: none; }
  .lect-inline { display: block; }
  .tt th, .tt td { padding-inline: 6px; }
  .tt .c-time { width: 54px; }
  .tt .c-len { width: 64px; }
  .len-in { width: 58px; padding: 6px 4px; }
  .tt .c-act { width: 72px; }
  .headline .big { font-size: 1.8rem; }
  .export { position: sticky; bottom: 0; z-index: 20; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); border-radius: var(--radius) var(--radius) 0 0; box-shadow: 0 -4px 16px rgba(15,30,50,.08); }
  .export .lbl { flex-basis: 100%; }
  .export button.xbtn { flex: 1 1 auto; padding: 8px 10px; }
  .export .all { margin-inline-start: 0; flex-basis: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1 data-t="appTitle">מחולל לו"ז ליום הרצאות</h1>
      <p data-t="tagline"></p>
    </div>
    <div class="top-actions">
      <div class="seg" role="group" aria-label="Language">
        <button type="button" id="lang-he" data-lang="he">עברית</button>
        <button type="button" id="lang-en" data-lang="en">English</button>
      </div>
      <div class="pop-wrap">
        <button type="button" class="icon-btn" id="add-day-btn" aria-haspopup="true"><span data-t="addDay"></span></button>
        <div class="pop" id="add-day-pop" hidden>
          <button type="button" id="add-blank" data-t="blankDay"></button>
          <button type="button" id="add-dup" data-t="dupDay"></button>
        </div>
      </div>
      <div class="pop-wrap">
        <button type="button" class="icon-btn" id="menu-btn" aria-haspopup="true" data-t-aria="moreMenu">⋯</button>
        <div class="pop" id="menu-pop" hidden>
          <button type="button" class="danger" id="reset-all" data-t="resetAll"></button>
        </div>
      </div>
    </div>
  </header>

  <nav class="tabs" id="tabs" hidden></nav>

  <div class="main">
    <section class="panel settings" id="settings">
      <div class="settings-head">
        <h2 data-t="settings"></h2>
        <button type="button" class="icon-btn collapse-btn" id="collapse-btn" aria-expanded="true"><span data-t="hide"></span></button>
      </div>
      <div class="settings-body">
        <div class="field">
          <label for="f-start" data-t="start"></label>
          <input type="time" id="f-start" step="300">
          <p class="err" id="e-start" hidden></p>
        </div>

        <div class="field">
          <label for="f-len" data-t="lecLen"></label>
          <div class="len-line">
            <input type="number" id="f-len" inputmode="decimal">
            <div class="seg" role="group" id="unit-seg">
              <button type="button" data-unit="min" data-t="unitMin"></button>
              <button type="button" data-unit="ah" data-t="unitAH"></button>
            </div>
          </div>
          <p class="hint num" id="len-conv"></p>
          <p class="hint" data-t="ahHint"></p>
          <p class="err" id="e-lecLen" hidden></p>
        </div>

        <div class="field">
          <label for="f-brk" data-t="brk"></label>
          <input type="number" id="f-brk" min="0" max="120" step="5" inputmode="numeric">
          <p class="err" id="e-brk" hidden></p>
        </div>

        <hr class="divider">

        <div class="field">
          <span class="lbl" data-t="mode"></span>
          <div class="seg" role="group" id="mode-seg">
            <button type="button" data-mode="count" data-t="modeCount"></button>
            <button type="button" data-mode="end" data-t="modeEnd"></button>
          </div>
        </div>
        <div class="field" id="w-count">
          <label for="f-count" data-t="count"></label>
          <input type="number" id="f-count" min="1" max="12" step="1" inputmode="numeric">
          <p class="err" id="e-count" hidden></p>
        </div>
        <p class="hint" id="w-count-manual" data-t="countManual" hidden></p>
        <div class="field" id="w-target" hidden>
          <label for="f-target" data-t="target"></label>
          <input type="time" id="f-target" step="300">
          <p class="err" id="e-target" hidden></p>
        </div>

        <hr class="divider">

        <label class="switch" for="t-long">
          <span class="s-text"><b data-t="longOn"></b></span>
          <input type="checkbox" id="t-long"><span class="track" aria-hidden="true"></span>
        </label>
        <div class="sub" id="w-long" hidden>
          <div class="row2">
            <div class="field">
              <label for="f-longlen" data-t="longLen"></label>
              <input type="number" id="f-longlen" min="5" max="180" step="5" inputmode="numeric">
            </div>
            <div class="field">
              <label for="f-longpos" data-t="longPos"></label>
              <select id="f-longpos"></select>
            </div>
          </div>
          <p class="err" id="e-longLen" hidden></p>
        </div>

        <label class="switch" for="t-gw">
          <span class="s-text"><b data-t="gwOn"></b></span>
          <input type="checkbox" id="t-gw"><span class="track" aria-hidden="true"></span>
        </label>
        <div class="sub" id="w-gw" hidden>
          <div class="row2">
            <div class="field">
              <label for="f-gather" data-t="gatherMin"></label>
              <input type="number" id="f-gather" min="0" max="120" step="5" inputmode="numeric">
            </div>
            <div class="field">
              <label for="f-wrap" data-t="wrapMin"></label>
              <input type="number" id="f-wrap" min="0" max="120" step="5" inputmode="numeric">
            </div>
          </div>
          <p class="err" id="e-gw" hidden></p>
        </div>

        <label class="switch" for="t-manual">
